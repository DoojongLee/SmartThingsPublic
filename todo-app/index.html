<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Todo</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c63ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daily Todo" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header / Briefing -->
    <header class="briefing">
      <div class="briefing-date" id="briefingDate"></div>
      <h1 class="briefing-title">오늘의 할일 브리핑</h1>
      <p class="briefing-summary" id="briefingSummary"></p>
    </header>

    <!-- Stats -->
    <section class="stats">
      <div class="stat-card">
        <span class="stat-value" id="totalCompleted">0</span>
        <span class="stat-label">전체 완료</span>
      </div>
      <div class="stat-card accent">
        <span class="stat-value" id="todayCompleted">0</span>
        <span class="stat-label">오늘 완료</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="remaining">0</span>
        <span class="stat-label">남은 할일</span>
      </div>
    </section>

    <!-- Goal Progress -->
    <section class="goal-section">
      <div class="goal-header">
        <span class="goal-label">목표 달성률</span>
        <div class="goal-controls">
          <label class="goal-edit-label">목표:
            <input type="number" id="goalInput" min="1" max="999" value="10" />
            개
          </label>
        </div>
        <span class="goal-percent" id="goalPercent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="goal-detail" id="goalDetail"></div>
    </section>

    <!-- Calendar sync bar -->
    <section class="cal-section">
      <div class="cal-header">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="2" width="14" height="13" rx="2"/>
          <line x1="1" y1="6" x2="15" y2="6"/>
          <line x1="5" y1="1" x2="5" y2="4"/>
          <line x1="11" y1="1" x2="11" y2="4"/>
        </svg>
        <span>캘린더 연동</span>
        <span class="cal-badge">Apple / Google</span>
      </div>
      <div class="cal-actions">
        <button id="exportAllBtn" class="cal-btn export">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6.5" y1="1" x2="6.5" y2="9"/><polyline points="3,6 6.5,9 10,6"/>
            <line x1="1" y1="12" x2="12" y2="12"/>
          </svg>
          전체 내보내기 (.ics)
        </button>
        <button id="importBtn" class="cal-btn import">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6.5" y1="9" x2="6.5" y2="1"/><polyline points="3,4 6.5,1 10,4"/>
            <line x1="1" y1="12" x2="12" y2="12"/>
          </svg>
          캘린더에서 가져오기
        </button>
        <input type="file" id="importIcsInput" accept=".ics" class="hidden" />
      </div>
      <p class="cal-hint">
        📲 <strong>내보내기</strong>: ICS 파일 다운로드 → Apple/Google Calendar에서 열기<br>
        📥 <strong>가져오기</strong>: Calendar 앱에서 ICS 내보낸 후 업로드
      </p>
    </section>

    <!-- Add Todo -->
    <section class="add-section">
      <div class="add-inputs">
        <input
          type="text"
          id="todoInput"
          placeholder="새 할일을 입력하세요..."
          maxlength="100"
        />
        <input
          type="date"
          id="dueDateInput"
          title="마감일 (선택)"
        />
      </div>
      <button id="addBtn">추가</button>
    </section>

    <!-- Todo List -->
    <section class="todo-list-section">
      <div id="todoList" class="todo-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <span>🎉</span>
        <p>오늘 할일을 모두 완료했어요!</p>
      </div>
    </section>

    <!-- Completed History -->
    <section class="history-section">
      <button class="history-toggle" id="historyToggle">
        완료된 항목 보기 <span id="historyCount"></span>
      </button>
      <div id="historyList" class="history-list hidden"></div>
    </section>

  </div>

  <!-- Toast -->
  <div id="importToast" class="toast"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
